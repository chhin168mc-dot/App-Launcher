name: Add NoBlocklist Submodule

on:
  workflow_dispatch:

jobs:
  add-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add NoBlocklist Submodule
        run: |
          git submodule add -b master https://github.com/chhin168mc-dot/NoBlocklist NoBlocklist
          git commit -m "Add NoBlocklist submodule"
          git push
